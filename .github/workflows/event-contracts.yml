name: fitness-event-contracts

on:
  pull_request:
    paths:
      - ".github/workflows/event-contracts.yml"
      - "docs/COMMANDS.md"
      - "docs/ops/FITNESS-PLAYBOOK-VERIFICATION.md"
      - "exports/fitness.playbook.verification.report.v1.json"
      - "package.json"
      - "src/lib/ecosystem/**"
      - "truth-pack/fitness/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/event-contracts.yml"
      - "docs/COMMANDS.md"
      - "docs/ops/FITNESS-PLAYBOOK-VERIFICATION.md"
      - "exports/fitness.playbook.verification.report.v1.json"
      - "package.json"
      - "src/lib/ecosystem/**"
      - "truth-pack/fitness/**"
  workflow_dispatch:

jobs:
  validate:
    uses: ZachariahRedfield/playbook/.github/workflows/event-contract-pack.yml@9ce397e893e4007afbe93366770867ed64f66500
    with:
      node-version: "22"
      working-directory: "."
      install-command: npm ci
      contract-check-command: npm run test:fitness-event-contracts
      warehouse-check-command: npm run test:fitness-shadow-warehouse
