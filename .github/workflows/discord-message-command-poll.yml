name: Deprecated Discord Message Command Poll

on:
  workflow_dispatch:

concurrency:
  group: discord-message-command-poll
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Report migration to DiscordOS
        shell: bash
        run: |
          set -euo pipefail
          echo "Discord message command polling no longer belongs to fawxzzy-fitness."
          echo "Use the hosted DiscordOS runtime instead:"
          echo "- repo: https://github.com/fawxzzy/DiscordOS"
          echo "- workflow: Discord Message Command Worker"
          echo "- production runtime: https://fawxzzy-discordos.vercel.app"
