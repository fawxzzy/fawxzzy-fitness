name: atlas-contracts

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  contract-check:
    runs-on: ubuntu-latest
    env:
      source_contract_commit: b48f820d3eca094800c2f3ccb36901dadfd259a9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Contract Check
        run: npm run test:atlas-contracts
      - name: Verify
        run: npm run verify
