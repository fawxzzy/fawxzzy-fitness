name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify curated engine, planning intake, exercise catalog, and roadmap contracts
        run: |
          node --import ./scripts/register-test-aliases.mjs --test src/app/viewport.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/layout/bottomActionIntents.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/ui/visualFloors.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/reduced-motion.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/ui/dockRoles.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/app-loader.test.ts src/lib/app-loader-controller.test.ts src/lib/app-loader.contract.test.ts
          node scripts/generate-app-loader-icon.mjs --check
          node --import ./scripts/register-test-aliases.mjs --test src/app/login/page.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/auth/signupFeedback.test.ts tests/signup-failure-copy-action.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/lib/supabase/update-user.test.ts tests/password-mutation-actions.test.mjs src/lib/recovery-session.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/error/auth-session-preservation.contract.test.ts src/components/error/errorScreens.contract.test.tsx
          node --import ./scripts/register-test-aliases.mjs --test src/components/auth/authMessages.test.ts src/lib/install/config.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/proxy.test.ts src/lib/detail-route-guard.test.ts src/lib/next-navigation-errors.test.ts src/lib/async-request-helpers.contract.test.ts src/lib/dev-page-guard-runtime.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/timezones.test.ts src/lib/history-local-day-boundary.test.ts src/lib/history-sessions-page-loader.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/history-consistency-heatmap.test.ts src/components/history/ConsistencyHeatmapSurface.test.tsx
          node --import ./scripts/register-test-aliases.mjs --test src/app/auth/session-sync/route.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/auth/sign-out-revocation.test.ts src/lib/auth/device-sign-out.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/supabase/client.session-sync.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/auth/session-handoff/route.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/auth-handoff-supabase-store.test.ts scripts/qa/fitness-auth-handoff-loopback.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/offline/quick-log-queue.test.ts src/lib/offline/sync-engine.test.ts src/components/SessionExerciseFocus.quickLogOffline.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/recovery-timing.test.ts src/lib/set-logged-at.test.ts src/lib/recovery-timing.contract.test.ts src/lib/history-log-normalization.test.ts
          node --test tests/session-add-set-logged-at.test.mjs
          npm run test:supabase-schema-binding
          node --test scripts/migration/member-identity-authority.contract.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/app/manifest.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/signup/SignupEntry.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/routines/RoutineEditorForm.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/exercise-info-day-key.test.ts src/lib/progression-summary-activity.test.ts src/lib/progression-activity-zone.test.ts src/lib/progression-lifeline-summary.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/ui/FilterToggleButton.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/engine.test.ts src/features/curated-onboarding/engine.safety.test.ts src/features/curated-onboarding/engine.adjustments.test.ts src/features/curated-onboarding/engine.matrix.test.ts src/features/curated-onboarding/api-contract.test.ts src/features/curated-onboarding/api-contract.safety.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/questionnaire.test.ts src/features/curated-onboarding/reducer.test.ts src/features/curated-onboarding/storage.test.ts src/features/curated-onboarding/selectors.test.ts src/features/curated-onboarding/handoff.test.ts src/features/curated-onboarding/handoff.actions.test.ts src/app/curated-onboarding/actions.test.ts src/app/curated-onboarding/actions.contract.test.ts src/app/curated-onboarding/replay.test.ts src/app/curated-onboarding/history-signals.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/feature-flags.test.ts src/lib/initial-experience-gate.test.ts src/lib/resolvePostLoginDestination.test.ts
          node --test tests/curated-onboarding-ui-contract.test.mjs
          node --test tests/screen-header-contract.test.mjs
          node --test tests/app-menu-header-contract.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/lib/app-menu.test.ts
          node --test tests/routines-detail-header-contract.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/planning/normalize.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/planning/catalog/catalog.test.ts
          node --test scripts/seed-feedback-monetization-roadmap.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/lib/api-auth.test.ts src/lib/billing/pro-access-diagnostics.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/session-action-response.test.ts src/lib/today-notice.test.ts src/lib/app-notice-anchor.test.ts src/lib/duration.test.ts src/lib/today-discard-dialog.contract.test.ts src/lib/best-effort-steps.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/navigation-return.test.ts src/lib/navigation-return.safety.test.ts src/lib/redirect-targets.safety.test.ts src/lib/account-navigation.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/today-switch-day.test.ts src/lib/ambient/app-backdrop.test.ts src/app/today/TodaySwitchDayCard.contract.test.tsx
          npm run test:project-board-owner-export
          npm run project-board:owner-export:check
          node --test tests/board-sync.test.mjs
          npm run board:check
          node --import ./scripts/register-test-aliases.mjs --test src/lib/progression-manual-promotion.test.ts src/lib/progression-manual-promotion-supabase.test.ts
          npm run test:card-system
          npm run test:dom

      - name: Build
        run: npm run build

      - name: Fail on tracked files over 10MB
        run: |
          oversized=$(git ls-files -z | xargs -0 -I{} sh -c 'size=$(wc -c <"{}" 2>/dev/null || echo 0); if [ "$size" -gt 10485760 ]; then echo "{} ($size bytes)"; fi')
          if [ -n "$oversized" ]; then
            echo "Tracked files over 10MB detected:"
            echo "$oversized"
            exit 1
          fi

  all-tests:
    name: All tests (npm run test:all)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # Runs every *.test.{ts,tsx,mjs,js} file except those named with a reason in
      # scripts/test-all.exclusions.json, so a new test file cannot go unreferenced.
      - name: Run all tests
        run: npm run test:all

  playbook-clean-environment:
    name: Playbook clean-environment validation
    runs-on: ubuntu-latest
    env:
      PLAYBOOK_OFFICIAL_FALLBACK_SPEC: https://github.com/fawxzzy/playbook/releases/download/v0.74.0/playbook-cli-0.74.0.tgz
      PLAYBOOK_OFFICIAL_FALLBACK_SHA256: 6b0abf33835c57331f0ef471fef2a803e2cbabc1d673f528e62b2f5213462ac7
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from a clean environment
        run: npm ci

      - name: Acquire Playbook runtime from the canonical official distribution
        run: node scripts/playbook-runtime.mjs --install-official-fallback

      - name: Validate canonical Playbook command ladder
        run: |
          unset PLAYBOOK_BIN

          node scripts/playbook-runtime.mjs ai-context
          node scripts/playbook-runtime.mjs ai-contract
          node scripts/playbook-runtime.mjs context
          node scripts/playbook-runtime.mjs index
          node scripts/playbook-runtime.mjs verify
          node scripts/playbook-runtime.mjs plan
          node scripts/playbook-runtime.mjs pilot

      - name: Assert required runtime artifacts are written under .playbook/
        run: |
          required_artifacts=(
            ".playbook/findings.json"
            ".playbook/plan.json"
            ".playbook/repo-graph.json"
          )

          for artifact in "${required_artifacts[@]}"; do
            if [ ! -f "$artifact" ]; then
              echo "Expected required Playbook artifact '$artifact' to exist, but it was missing."
              exit 1
            fi
          done

          echo "All required Playbook artifacts are present under .playbook/."
