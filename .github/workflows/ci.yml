name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify curated engine, planning intake, exercise catalog, and roadmap contracts
        run: |
          node --import ./scripts/register-test-aliases.mjs --test src/app/viewport.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/layout/bottomActionIntents.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/reduced-motion.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/login/page.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/auth/signupFeedback.test.ts tests/signup-failure-copy-action.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/components/error/auth-session-preservation.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/middleware.test.ts src/lib/detail-route-guard.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/timezones.test.ts src/lib/history-local-day-boundary.test.ts src/lib/history-sessions-page-loader.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/history-consistency-heatmap.test.ts src/components/history/ConsistencyHeatmapSurface.test.tsx
          node --import ./scripts/register-test-aliases.mjs --test src/app/auth/session-sync/route.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/supabase/client.session-sync.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/auth/session-handoff/route.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/auth-handoff-supabase-store.test.ts scripts/qa/fitness-auth-handoff-loopback.test.ts
          npm run test:supabase-schema-binding
          node --test scripts/migration/member-identity-authority.contract.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/app/manifest.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/app/signup/SignupEntry.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/routines/RoutineEditorForm.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/exercise-info-day-key.test.ts src/lib/progression-summary-activity.test.ts src/lib/progression-activity-zone.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/ui/FilterToggleButton.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/components/ui/app/AppHeader.contract.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/engine.test.ts src/features/curated-onboarding/engine.safety.test.ts src/features/curated-onboarding/engine.adjustments.test.ts src/features/curated-onboarding/engine.matrix.test.ts src/features/curated-onboarding/api-contract.test.ts src/features/curated-onboarding/api-contract.safety.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/questionnaire.test.ts src/features/curated-onboarding/reducer.test.ts src/features/curated-onboarding/storage.test.ts src/features/curated-onboarding/selectors.test.ts src/features/curated-onboarding/handoff.test.ts src/features/curated-onboarding/handoff.actions.test.ts src/app/curated-onboarding/actions.test.ts src/app/curated-onboarding/actions.contract.test.ts src/app/curated-onboarding/replay.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/lib/feature-flags.test.ts src/lib/initial-experience-gate.test.ts src/lib/resolvePostLoginDestination.test.ts
          node --test tests/curated-onboarding-ui-contract.test.mjs
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/planning/normalize.test.ts
          node --import ./scripts/register-test-aliases.mjs --test src/features/curated-onboarding/planning/catalog/catalog.test.ts
          node --test scripts/seed-feedback-monetization-roadmap.test.mjs
          npm run test:project-board-owner-export
          npm run project-board:owner-export:check

      - name: Build
        run: npm run build

      - name: Fail on tracked files over 10MB
        run: |
          oversized=$(git ls-files -z | xargs -0 -I{} sh -c 'size=$(wc -c <"{}" 2>/dev/null || echo 0); if [ "$size" -gt 10485760 ]; then echo "{} ($size bytes)"; fi')
          if [ -n "$oversized" ]; then
            echo "Tracked files over 10MB detected:"
            echo "$oversized"
            exit 1
          fi

  playbook-clean-environment:
    name: Playbook clean-environment validation
    runs-on: ubuntu-latest
    env:
      PLAYBOOK_OFFICIAL_FALLBACK_SPEC: https://github.com/fawxzzy/playbook/releases/download/v0.54.1/playbook-cli-0.54.1.tgz
      PLAYBOOK_OFFICIAL_FALLBACK_SHA256: 6fb915baaa0837c70a942c60caaf110ba56abee6dd722de8a686b4757e768ba1
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies from a clean environment
        run: npm ci

      - name: Acquire Playbook runtime from the canonical official distribution
        run: node scripts/playbook-runtime.mjs --install-official-fallback

      - name: Validate canonical Playbook command ladder
        run: |
          unset PLAYBOOK_BIN

          node scripts/playbook-runtime.mjs ai-context
          node scripts/playbook-runtime.mjs ai-contract
          node scripts/playbook-runtime.mjs context
          node scripts/playbook-runtime.mjs index
          node scripts/playbook-runtime.mjs verify
          node scripts/playbook-runtime.mjs plan
          node scripts/playbook-runtime.mjs pilot

      - name: Assert required runtime artifacts are written under .playbook/
        run: |
          required_artifacts=(
            ".playbook/findings.json"
            ".playbook/plan.json"
            ".playbook/repo-graph.json"
          )

          for artifact in "${required_artifacts[@]}"; do
            if [ ! -f "$artifact" ]; then
              echo "Expected required Playbook artifact '$artifact' to exist, but it was missing."
              exit 1
            fi
          done

          echo "All required Playbook artifacts are present under .playbook/."
